spring.application.name=StudyS

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studys}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studys}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studys}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Auth JWT — em producao, defina STUDYS_JWT_SECRET (minimo 32 caracteres) via env
studys.auth.jwt-secret=${STUDYS_JWT_SECRET:dev-only-secret-com-no-minimo-32-caracteres-para-hs256}
studys.auth.jwt-expiration-ms=${STUDYS_JWT_EXPIRATION_MS:86400000}
