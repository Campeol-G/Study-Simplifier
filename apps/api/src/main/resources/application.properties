spring.application.name=StudyS

# App desktop local: usuario unico, sem servidor de autenticacao, banco no home.
# O diretorio ~/.studys/ e criado por SqliteDataSourceConfig antes da primeira conexao, porque o
# SQLite cria o arquivo mas nao o diretorio. Os pragmas vivem na URL:
#   foreign_keys=on   obrigatorio: sem isso cascades e integridade referencial falham em silencio
#   journal_mode=WAL  por isso aparecem *.db-wal e *.db-shm no .gitignore
#   busy_timeout=5000 espera 5 s em vez de falhar com SQLITE_BUSY
spring.datasource.url=jdbc:sqlite:${user.home}/.studys/studys.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000

# SQLite tem escritor unico: mais de uma conexao concorrencia gera SQLITE_BUSY.
spring.datasource.hikari.maximum-pool-size=1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# validate e a rede de seguranca do projeto: se entidade e migration divergirem, o app nao sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
