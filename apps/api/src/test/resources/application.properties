spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/studys-teste-${random.uuid}.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

# Este arquivo SUBSTITUI o application.properties de producao, nao o complementa: e o mesmo recurso
# de classpath e o test-classes ganha. Por isso o que faltar aqui e o que os testes nao exercitam.
# Pool de 1 e open-in-view=false sao os valores de producao e precisam valer aqui tambem, senao a
# suite roda com o default do Hikari (10) e nunca ve a restricao de escritor unico do SQLite.
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=WARN
logging.level.org.springframework=WARN
