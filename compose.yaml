services:
  postgres:
    image: postgres:16-alpine
    container_name: studys-postgres
    environment:
      POSTGRES_DB: studys
      POSTGRES_USER: studys
      POSTGRES_PASSWORD: studys
    ports:
      - "5432:5432"
    volumes:
      - studys-pgdata:/var/lib/postgresql/data

volumes:
  studys-pgdata:
