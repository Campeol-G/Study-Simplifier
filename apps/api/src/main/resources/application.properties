spring.application.name=StudyS

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studys}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studys}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studys}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
